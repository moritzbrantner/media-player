[package]
name = "media-player"
version = "0.1.0"
description = "Cross-platform local media player"
authors = ["moritzbrantner"]
edition = "2021"

[lib]
name = "media_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset"] }
