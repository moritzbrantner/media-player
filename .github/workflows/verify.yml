name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm run verify:web

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  native-validation:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/native.yml
    secrets: inherit
    permissions:
      contents: read

  runtime-validation:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    uses: ./.github/workflows/runtime-evidence.yml
    secrets: inherit
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["web", "rust", "native-validation", "runtime-validation"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["web", "rust", "native-validation", "runtime-validation"]'
          allow-skipped: ${{ github.event_name != 'pull_request' && '["native-validation", "runtime-validation"]' || (github.base_ref != 'main' && '["runtime-validation"]' || '[]') }}
