name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-player-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pages build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Verify and build static player
        run: npm run verify:web
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Pages deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static player
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Hosted smoke
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify hosted player and acceptance surface
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --location --silent --show-error "$PAGE_URL" -o page.html; then
              grep -q 'id="file-input"' page.html
              grep -q 'id="queue-list"' page.html
              grep -q 'id="play-button"' page.html

              ACCEPTANCE_URL="${PAGE_URL%/}/acceptance.html?target=browser"
              curl --fail --location --silent --show-error "$ACCEPTANCE_URL" -o acceptance.html
              grep -q 'id="acceptance-file"' acceptance.html
              grep -q 'id="acceptance-audio"' acceptance.html
              grep -q 'id="heard-audio"' acceptance.html
              exit 0
            fi
            sleep 5
          done
          echo "Hosted player did not become reachable at $PAGE_URL" >&2
          exit 1
