name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-player-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pages build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-package-lock
      - name: Verify and build static player
        run: npm run verify:web
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Pages deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static player
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    name: Hosted smoke
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify hosted player and acceptance surface
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --location --silent --show-error "$PAGE_URL" -o page.html; then
              grep -q 'id="file-input"' page.html
              grep -q 'id="queue-list"' page.html
              grep -q 'id="play-button"' page.html
              grep -q 'id="mobile-mini-player"' page.html
              grep -q 'id="mobile-view-nav"' page.html

              ACCEPTANCE_URL="${PAGE_URL%/}/acceptance.html?target=browser"
              curl --fail --location --silent --show-error "$ACCEPTANCE_URL" -o acceptance.html
              grep -q 'id="acceptance-file"' acceptance.html
              grep -q 'id="acceptance-audio"' acceptance.html
              grep -q 'id="heard-audio"' acceptance.html
              exit 0
            fi
            sleep 5
          done
          echo "Hosted player did not become reachable at $PAGE_URL" >&2
          exit 1
