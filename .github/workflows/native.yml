name: Native

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

# Android and iOS hosted package jobs are intentionally paused for now.
# Keep the local Tauri build/acceptance commands available; mobile evidence is
# gathered explicitly on a developer machine until these jobs are restored.
jobs:
  desktop:
    name: Desktop / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install Tauri CLI
        run: npm install --ignore-scripts
      - name: Build desktop host
        run: npm run tauri:build
